const state = { mode: 'rooms', area: 'courtyard', fading: false };

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); frameArea(); fitCamera(); });

// ---- Keys ----
const keys = new Set();
addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); keys.add(k);
  if (k === 'e') { const d = nearestDoor(); if (d) d.manual = !(d.manual === true || d.angle > Math.PI / 2); }

const keysEl = document.getElementById('keys');

    : 'WASD / arrows walk · E door · Q / R turn the view · wheel or +/− zoom · C cutaway on/off · M back to rooms';

// ---- Where you are, on the plans' grid: columns A-N west to east, rows 1-14 north to south ----
const whereEl = document.getElementById('where'), hintEl = document.getElementById('hint');
function whereText() {
  const col = 'ABCDEFGHIJKLMN'[Math.floor((P.z + 28) / 4)] || '·', row = Math.floor((28 - P.x) / 4) + 1;
  const level = state.mode === 'rooms' ? AREAS[state.area].name : P.y < -2 ? 'the cells' : P.y < 2.5 ? (roofed(P.x, P.y, P.z) ? 'ground floor' : 'outside') : P.y < 7.5 ? (Math.abs(P.x) > 20.5 || Math.abs(P.z) > 20.5 ? 'the wall walk' : 'first floor') : 'second floor';

const clock = new THREE.Clock();
let lampT = 0;
