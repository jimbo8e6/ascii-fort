<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ASCII Fort</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060d; overflow: hidden; touch-action: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; color: #e8d9b0;
    -webkit-user-select: none; user-select: none; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(5, 6, 13, .72); text-align: center; padding: 16px; cursor: pointer; z-index: 5; }
  #start h1 { margin: 0; font-size: clamp(28px, 7vw, 56px); letter-spacing: .2em; color: #ffb347; }
  #start p { margin: 0; font-size: 14px; line-height: 1.7; opacity: .85; }
  #start .go { margin-top: 8px; padding: 10px 22px; border: 1px solid #ffb347; color: #ffb347; }
  #hud { position: fixed; left: 12px; bottom: 12px; font-size: 12px; opacity: .7; pointer-events: none; z-index: 2; line-height: 1.6; }
  #buttons { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; display: flex; gap: 8px; z-index: 6; }
  .btn { background: rgba(10, 12, 24, .6); border: 1px solid rgba(255, 179, 71, .6); color: #ffb347;
    font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer; }
  #jump { position: fixed; right: 24px; bottom: 32px; width: 64px; height: 64px; border-radius: 50%; display: none; z-index: 3;
    align-items: center; justify-content: center; }
  #stick { position: fixed; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%;
    border: 1px solid rgba(255, 179, 71, .4); display: none; pointer-events: none; z-index: 3; }
  #knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
    background: rgba(255, 179, 71, .35); }
  body.touch #jump { display: flex; }
  body.touch .keys { display: none; }
  body:not(.touch) .touchhelp { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="start">
  <h1>ASCII FORT</h1>
  <p class="keys">WASD / arrows: move &middot; mouse: look &middot; shift: run &middot; space: jump<br>
     T: toggle ASCII &middot; G: style &middot; [ ]: character size &middot; esc: pause</p>
  <p class="touchhelp">Left thumb: move &middot; right thumb: look &middot; button: jump</p>
  <div class="go" id="go">click / tap to enter</div>
</div>
<div id="hud"><span class="keys">T ascii &middot; G style &middot; [ ] size</span></div>
<div id="buttons">
  <button class="btn" id="btnAscii">ASCII: ON</button>
  <button class="btn" id="btnStyle">STYLE: FINE</button>
  <button class="btn" id="btnCell">SIZE</button>
</div>
<button class="btn" id="jump">JUMP</button>
<div id="stick"><div id="knob"></div></div>

<script type="module">
import * as THREE from 'three';

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1337);                       // cosmetic randomness (textures, flicker)
const SEED = (parseInt(new URLSearchParams(location.search).get('seed'), 10) || 1337) | 0;

// 2D simplex noise, roughly in [-1, 1]
function makeNoise2D(seed) {
  const r = mulberry32(seed), p = new Uint8Array(512);
  const base = [...Array(256).keys()];
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [base[i], base[j]] = [base[j], base[i]]; }
  for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  const GX = [1, -1, 1, -1, 1, -1, 0, 0], GY = [1, 1, -1, -1, 0, 0, 1, -1];
  const F2 = .5 * (Math.sqrt(3) - 1), G2 = (3 - Math.sqrt(3)) / 6;
  const corner = (x, y, g) => { let t = .5 - x * x - y * y; if (t < 0) return 0; t *= t; return t * t * (GX[g & 7] * x + GY[g & 7] * y); };
  return (xin, yin) => {
    const s = (xin + yin) * F2, i = Math.floor(xin + s), j = Math.floor(yin + s), t = (i + j) * G2;
    const x0 = xin - (i - t), y0 = yin - (j - t);
    const i1 = x0 > y0 ? 1 : 0, j1 = 1 - i1;
    const ii = i & 255, jj = j & 255;
    return 70 * (corner(x0, y0, p[ii + p[jj]]) +
                 corner(x0 - i1 + G2, y0 - j1 + G2, p[ii + i1 + p[jj + j1]]) +
                 corner(x0 - 1 + 2 * G2, y0 - 1 + 2 * G2, p[ii + 1 + p[jj + 1]]));
  };
}
const noiseA = makeNoise2D(SEED), noiseB = makeNoise2D(SEED + 1), noiseC = makeNoise2D(SEED + 2);

// Deterministic per-column random number in [0, 1)
function hash2(x, z) {
  let h = Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(SEED, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const smoothstep = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function canvasTexture(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.magFilter = THREE.NearestFilter;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

function noiseFill(g, size, base, spread, y0 = 0, y1 = size) {
  for (let y = y0; y < y1; y++) for (let x = 0; x < size; x++) {
    const v = (rand() - .5) * spread;
    g.fillStyle = `rgb(${base[0] + v | 0},${base[1] + v | 0},${base[2] + v | 0})`;
    g.fillRect(x, y, 1, 1);
  }
}

// ---------------------------------------------------------------------------
// Procedural textures (one block = one texture tile; canvas top = block top)
// ---------------------------------------------------------------------------
const TEX = {
  brick: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [150, 140, 125], 30);
    g.fillStyle = 'rgba(30,25,20,.85)';
    for (let row = 0; row < 4; row++) {
      const y = row * 8;
      g.fillRect(0, y, s, 1);
      for (let x = row % 2 ? 8 : 0; x < s + 16; x += 16) g.fillRect(x % s, y, 1, 8);
    }
  }),
  wood: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [120, 80, 45], 25);
    g.fillStyle = 'rgba(40,25,10,.8)';
    for (let y = 0; y < s; y += 8) g.fillRect(0, y, s, 1);
    g.strokeStyle = 'rgba(40,25,10,.8)';
    g.strokeRect(.5, .5, s - 1, s - 1);
    g.beginPath(); g.moveTo(0, 0); g.lineTo(s, s); g.stroke();
  }),
  grassTop: canvasTexture(32, (g, s) => noiseFill(g, s, [62, 92, 44], 34)),
  grassSide: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [110, 85, 60], 28);
    noiseFill(g, s, [62, 92, 44], 34, 0, 6);
    for (let x = 0; x < s; x++) if (rand() < .5) { g.fillStyle = 'rgb(62,92,44)'; g.fillRect(x, 6, 1, 1 + rand() * 4 | 0); }
  }),
  dirt: canvasTexture(32, (g, s) => noiseFill(g, s, [110, 85, 60], 28)),
  path: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [128, 108, 80], 30);
    g.fillStyle = 'rgba(70,60,45,.6)';
    for (let i = 0; i < 14; i++) g.fillRect(rand() * s | 0, rand() * s | 0, 2, 2);
  }),
  rock: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [118, 118, 122], 34);
    g.strokeStyle = 'rgba(40,40,45,.6)';
    for (let i = 0; i < 4; i++) { g.beginPath(); g.moveTo(rand() * s, rand() * s); g.lineTo(rand() * s, rand() * s); g.stroke(); }
  }),
  log: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [85, 60, 38], 20);
    g.fillStyle = 'rgba(30,20,10,.7)';
    for (let x = 2; x < s; x += 5) g.fillRect(x, 0, 1, s);
  }),
  logTop: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [150, 115, 75], 18);
    g.strokeStyle = 'rgba(80,55,30,.8)';
    for (let r = 3; r < 16; r += 4) { g.beginPath(); g.arc(16, 16, r, 0, Math.PI * 2); g.stroke(); }
  }),
  leaves: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [40, 78, 42], 40);
    g.fillStyle = 'rgba(10,25,12,.7)';
    for (let i = 0; i < 40; i++) g.fillRect(rand() * s | 0, rand() * s | 0, 2, 2);
  }),
};
// Textures for biome blocks and water
Object.assign(TEX, {
  sand: canvasTexture(32, (g, s) => noiseFill(g, s, [150, 134, 98], 24)),
  sandstone: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [140, 120, 84], 20);
    g.fillStyle = 'rgba(120,95,60,.6)';
    for (let y = 5; y < s; y += 9) g.fillRect(0, y, s, 1);
  }),
  snowTop: canvasTexture(32, (g, s) => noiseFill(g, s, [170, 178, 194], 16)),
  snowSide: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [110, 85, 60], 28);
    noiseFill(g, s, [170, 178, 194], 16, 0, 7);
    for (let x = 0; x < s; x++) if (rand() < .5) { g.fillStyle = 'rgb(170,178,194)'; g.fillRect(x, 7, 1, 1 + rand() * 4 | 0); }
  }),
  ice: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [96, 124, 158], 16);
    g.strokeStyle = 'rgba(170,195,225,.6)';
    for (let i = 0; i < 5; i++) { g.beginPath(); const x = rand() * s, y = rand() * s; g.moveTo(x, y); g.lineTo(x + 8, y - 6); g.stroke(); }
  }),
  cactus: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [62, 122, 52], 18);
    g.fillStyle = 'rgba(25,60,20,.8)';
    for (let x = 3; x < s; x += 7) g.fillRect(x, 0, 2, s);
    g.fillStyle = 'rgba(230,230,180,.9)';
    for (let i = 0; i < 12; i++) g.fillRect(rand() * s | 0, rand() * s | 0, 1, 1);
  }),
  cactusTop: canvasTexture(32, (g, s) => noiseFill(g, s, [86, 142, 64], 18)),
  oakLeaves: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [70, 112, 46], 42);
    g.fillStyle = 'rgba(15,35,10,.7)';
    for (let i = 0; i < 40; i++) g.fillRect(rand() * s | 0, rand() * s | 0, 2, 2);
  }),
  snowLeaves: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [40, 78, 42], 40);
    g.fillStyle = 'rgba(175,182,196,.9)';
    for (let i = 0; i < 70; i++) g.fillRect(rand() * s | 0, rand() * s | 0, 3, 2);
  }),
  water: canvasTexture(32, (g, s) => {
    noiseFill(g, s, [44, 86, 150], 26);
    g.strokeStyle = 'rgba(150,190,240,.55)';
    for (let i = 0; i < 8; i++) { const x = rand() * s, y = rand() * s; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 4, y - 2, x + 8, y); g.stroke(); }
  }),
});

// Material ids (1-based, used by the mesher); index = id - 1
const MAT_NAMES = ['brick', 'wood', 'grassTop', 'grassSide', 'dirt', 'path', 'rock', 'log', 'logTop', 'leaves',
  'sand', 'sandstone', 'snowTop', 'snowSide', 'ice', 'cactus', 'cactusTop', 'oakLeaves', 'snowLeaves', 'water'];
const MAT = Object.fromEntries(MAT_NAMES.map((n, i) => [n, i + 1]));
const materials = MAT_NAMES.map(n => n === 'water'
  ? new THREE.MeshLambertMaterial({ map: TEX.water, transparent: true, opacity: .78, depthWrite: false, emissive: 0x0a1a34 })
  : new THREE.MeshLambertMaterial({ map: TEX[n] }));

// ---------------------------------------------------------------------------
// Blocks, climate and terrain
// ---------------------------------------------------------------------------
const AIR = 0, BRICK = 1, WOOD = 2, GRASS = 3, DIRT = 4, PATH = 5, ROCK = 6, LOG = 7, LEAVES = 8,
      WATER = 9, SAND = 10, SANDSTONE = 11, SNOW = 12, ICE = 13, CACTUS = 14, OAK_LEAVES = 15, SNOW_LEAVES = 16;
const solid = v => v !== AIR && v !== WATER;
const CHUNK = 16, H = 64;                 // chunk footprint and world height
const G = 16;                             // ground level the fort is built on
const SEA = G - 3;                        // water fills empty space below this height
const CX = 32;                            // fort centre line (x); the fort spans roughly 6..58 in x and z
const F0 = 8, F1 = 56, WALL = 7;          // fort footprint and wall height

// Faces: 0 +x, 1 -x, 2 +y, 3 -y, 4 +z, 5 -z
function faceMaterial(type, face) {
  const top = face === 2, bottom = face === 3;
  switch (type) {
    case BRICK: return MAT.brick;
    case WOOD: return MAT.wood;
    case GRASS: return top ? MAT.grassTop : bottom ? MAT.dirt : MAT.grassSide;
    case DIRT: return MAT.dirt;
    case PATH: return top ? MAT.path : MAT.dirt;
    case ROCK: return MAT.rock;
    case LOG: return top || bottom ? MAT.logTop : MAT.log;
    case LEAVES: return MAT.leaves;
    case SAND: return MAT.sand;
    case SANDSTONE: return MAT.sandstone;
    case SNOW: return top ? MAT.snowTop : bottom ? MAT.dirt : MAT.snowSide;
    case ICE: return MAT.ice;
    case CACTUS: return top || bottom ? MAT.cactusTop : MAT.cactus;
    case OAK_LEAVES: return MAT.oakLeaves;
    case SNOW_LEAVES: return MAT.snowLeaves;
  }
  return 0;
}

// How strongly terrain is flattened to ground level G (1 = fully flat): the fort and the start of the road
function flatness(x, z) {
  const dx = Math.max(2 - x, 0, x - 62), dz = Math.max(2 - z, 0, z - 62);
  const fort = 1 - smoothstep(0, 18, Math.hypot(dx, dz));
  const road = (1 - smoothstep(3, 10, Math.abs(x + .5 - CX))) * (1 - smoothstep(20, 60, z - 62)) * (z > 50 ? 1 : 0);
  return Math.max(fort, road);
}

const isRoad = (x, z) => z >= F1 && Math.abs(x + .5 - CX) < 2.2 + noiseC(x * .2, z * .2) * .6;
const inCourtyard = (x, z) => x >= F0 && x < F1 && z >= F0 && z < F1;

// Climate: slow temperature, moisture and continent noise. All weights blend smoothly so
// terrain has no seams at biome borders. The fort's surroundings are kept temperate dry land.
const noiseT = makeNoise2D(SEED + 3), noiseM = makeNoise2D(SEED + 4), noiseK = makeNoise2D(SEED + 5);
function climate(x, z) {
  const near = 1 - smoothstep(120, 340, Math.hypot(x - CX, z - CX));
  const t = (noiseT(x * .0022, z * .0022) + .08 * noiseT(x * .03, z * .03)) * (1 - near * .9);
  const m = noiseM(x * .0022 + 200, z * .0022 - 100) * (1 - near * .6) + near * .3 + .08 * noiseM(x * .03, z * .03);
  const c = .75 * noiseK(x * .0016, z * .0016) + .25 * noiseK(x * .007 + 9, z * .007) + near * .9;
  const hot = smoothstep(.12, .36, t), cold = 1 - smoothstep(-.4, -.16, t);
  const dry = 1 - smoothstep(-.12, .1, m), wet = smoothstep(-.05, .22, m);
  return { desert: hot * dry, cold, wet: wet * (1 - hot), ocean: 1 - smoothstep(-.45, -.15, c) };
}

// Surface height: number of solid blocks in the column (player stands at this y)
function terrainHeight(x, z, cl = climate(x, z)) {
  const n = .65 * noiseA(x * .006, z * .006) + .25 * noiseA(x * .02 + 31, z * .02 - 17) + .1 * noiseA(x * .07, z * .07);
  const mountains = Math.max(0, noiseB(x * .004 + 50, z * .004)) ** 2 * 28 * (1 - cl.desert * .8) * (1 - cl.ocean);
  const rough = 1 - .55 * cl.desert - .3 * (1 - cl.wet) * (1 - cl.cold);       // deserts and plains are flatter
  let h = G + 1 + n * 13 * rough + mountains;
  h -= smoothstep(.45, .7, noiseC(x * .012 + 300, z * .012)) * cl.wet * 9;      // lakes in wet country
  h += (SEA - 8 - h) * cl.ocean;                                                   // sea floor
  h += (G - h) * flatness(x, z);
  return Math.max(2, Math.min(H - 12, Math.round(h)));
}

const OCEAN = 0, DESERT = 1, PLAINS = 2, FOREST = 3, SNOWY = 4;
const BIOME_NAMES = ['ocean', 'desert', 'plains', 'forest', 'snowy'];
function biomeOf(cl, h) {
  if (h <= SEA) return OCEAN;
  if (cl.desert > .5) return DESERT;
  if (cl.cold > .5 || h > G + 25) return SNOWY;
  return cl.wet > .5 ? FOREST : PLAINS;
}

// Forest patchiness in [0, 1]
const forest = (x, z) => smoothstep(-.15, .35, noiseB(x * .012 - 80, z * .012 + 40));

// Structure edits (the fort) applied on top of the terrain, stored per chunk
const edits = new Map();
const chunkKey = (cx, cz) => (cx + 32768) * 65536 + (cz + 32768);
function setEdit(x, y, z, v) {
  const k = chunkKey(x >> 4, z >> 4);
  if (!edits.has(k)) edits.set(k, []);
  edits.get(k).push((x & 15) | (z & 15) << 4 | y << 8, v);
}

// Generate one chunk's blocks: terrain and water, then trees, then structure edits
function generateChunk(cx, cz) {
  const data = new Uint8Array(CHUNK * CHUNK * H);
  const ox = cx * CHUNK, oz = cz * CHUNK;
  const M = 3, HM = M + 1, S = CHUNK + 2 * HM;    // trees can overhang by M; heights need one more for slopes
  const hm = new Int16Array(S * S), bm = new Uint8Array(S * S), cold = new Float32Array(S * S);
  for (let z = 0; z < S; z++) for (let x = 0; x < S; x++) {
    const wx = ox + x - HM, wz = oz + z - HM, cl = climate(wx, wz), h = terrainHeight(wx, wz, cl), i = x + z * S;
    hm[i] = h; bm[i] = biomeOf(cl, h); cold[i] = cl.cold;
  }
  const at = (lx, lz) => (lx + HM) + (lz + HM) * S;
  const hAt = (lx, lz) => hm[at(lx, lz)];
  const put = (lx, y, lz, v, onlyAir) => {
    if (lx < 0 || lz < 0 || lx >= CHUNK || lz >= CHUNK || y < 0 || y >= H) return;
    const i = lx + lz * CHUNK + y * 256;
    if (!onlyAir || !data[i]) data[i] = v;
  };

  for (let lz = 0; lz < CHUNK; lz++) for (let lx = 0; lx < CHUNK; lx++) {
    const x = ox + lx, z = oz + lz, i = at(lx, lz), h = hm[i], biome = bm[i];
    const slope = Math.max(Math.abs(h - hAt(lx + 1, lz)), Math.abs(h - hAt(lx - 1, lz)), Math.abs(h - hAt(lx, lz + 1)), Math.abs(h - hAt(lx, lz - 1)));
    let top = GRASS, sub = DIRT;
    if (inCourtyard(x, z) || isRoad(x, z)) top = PATH;
    else if (biome === OCEAN) { top = h < SEA - 4 ? DIRT : SAND; sub = SAND; }
    else if (biome === DESERT) { top = slope >= 4 ? SANDSTONE : SAND; sub = SANDSTONE; }
    else if (slope >= 3) top = sub = ROCK;
    else if (h <= SEA + 1) { top = SAND; sub = SAND; }                       // beaches
    else if (biome === SNOWY) top = SNOW;
    else if (h > G + 22) top = sub = ROCK;
    for (let y = 0; y < h; y++) put(lx, y, lz, y === h - 1 ? top : y >= h - 4 ? sub : ROCK);
    for (let y = h; y < SEA; y++) put(lx, y, lz, y === SEA - 1 && cold[i] > .6 ? ICE : WATER);
  }

  // Trees and cacti, including ones rooted just outside this chunk whose leaves reach in
  for (let tz = -M; tz < CHUNK + M; tz++) for (let tx = -M; tx < CHUNK + M; tx++) {
    const x = ox + tx, z = oz + tz, r0 = hash2(x, z);
    if (r0 > .05) continue;                                                     // cheap early out
    const i = at(tx, tz), h = hm[i], biome = bm[i];
    if (biome === OCEAN || h <= SEA + 1 || h > G + 24 || flatness(x, z) > .05) continue;
    if (Math.abs(h - hAt(tx + 1, tz)) + Math.abs(h - hAt(tx, tz + 1)) > 2) continue;
    const r = hash2(z, x);
    if (biome === FOREST || biome === SNOWY) {
      if (r0 > (biome === FOREST ? .05 * (.25 + .75 * forest(x, z)) : .022)) continue;
      const leaves = biome === SNOWY ? SNOW_LEAVES : LEAVES, th = 5 + (r * 4 | 0), topY = h + th + 1;
      for (let y = h; y < topY; y++) put(tx, y, tz, LOG);
      for (let y = h + 2; y <= topY; y++) {
        const rad = Math.min(3, (topY - y + 1) >> 1);
        for (let dz = -rad; dz <= rad; dz++) for (let dx = -rad; dx <= rad; dx++)
          if (dx * dx + dz * dz <= rad * rad + rad * .6) put(tx + dx, y, tz + dz, leaves, true);
      }
    } else if (biome === PLAINS) {
      if (r0 > .006) continue;
      const th = 4 + (r * 2 | 0), cy = h + th;                                  // round oak
      for (let y = h; y < cy; y++) put(tx, y, tz, LOG);
      for (let dy = -2; dy <= 1; dy++) for (let dz = -2; dz <= 2; dz++) for (let dx = -2; dx <= 2; dx++) {
        if (dx * dx + dz * dz + dy * dy * 1.5 > 5.2 || hash2(x + dx * 7, z + dz * 13 + dy * 31) < .12) continue;
        put(tx + dx, cy + dy, tz + dz, OAK_LEAVES, true);
      }
    } else if (biome === DESERT) {
      if (r0 > .005) continue;
      for (let y = h; y < h + 2 + (r * 3 | 0); y++) put(tx, y, tz, CACTUS);
    }
  }

  const list = edits.get(chunkKey(cx, cz));
  if (list) for (let i = 0; i < list.length; i += 2) {

// ---------------------------------------------------------------------------
// Chunk meshing: greedy merge of visible faces into one mesh per chunk,
// with one geometry group per material
// ---------------------------------------------------------------------------
// water = false meshes opaque blocks; water = true meshes only water surfaces (drawn as a separate transparent mesh)
function meshChunk(c, water = false) {
  const ox = c.cx * CHUNK, oz = c.cz * CHUNK, data = c.data;
  let ymax = 0;
  for (let i = data.length - 1; i >= 0; i--) if (data[i]) { ymax = Math.floor(i / 256) + 2; break; }
  ymax = Math.min(ymax, H);
  const dims = [CHUNK, ymax, CHUNK];
  const block = (x, y, z) => (x >= 0 && x < CHUNK && z >= 0 && z < CHUNK && y >= 0 && y < H)
    ? data[x + z * CHUNK + y * 256] : get(ox + x, y, oz + z);
  const buf = MAT_NAMES.map(() => ({ pos: [], nrm: [], uv: [], idx: [] }));

  for (let d = 0; d < 3; d++) {
    const u = (d + 1) % 3, v = (d + 2) % 3, x = [0, 0, 0], q = [0, 0, 0];
    q[d] = 1;
    const mask = new Int16Array(dims[u] * dims[v]);
    const posFace = d === 0 ? 0 : d === 1 ? 2 : 4;       // face index for the +d direction
    for (x[d] = -1; x[d] < dims[d];) {
      // Build the mask of faces between slice x[d] and x[d] + 1 that belong to this chunk
      let n = 0;
      for (x[v] = 0; x[v] < dims[v]; x[v]++) for (x[u] = 0; x[u] < dims[u]; x[u]++, n++) {
        const a = block(x[0], x[1], x[2]), b = block(x[0] + q[0], x[1] + q[1], x[2] + q[2]);
        const aIn = x[d] >= 0, bIn = x[d] < dims[d] - 1 || d === 1;
        if (water) mask[n] = a === WATER && !b && aIn ? MAT.water : b === WATER && !a && bIn ? -MAT.water : 0;
        else if (solid(a) && !solid(b) && aIn) mask[n] = faceMaterial(a, posFace);
        else if (solid(b) && !solid(a) && bIn) mask[n] = -faceMaterial(b, posFace + 1);
        else mask[n] = 0;
      }
      x[d]++;
      // Greedily merge equal neighbours into rectangles
      n = 0;
      for (let j = 0; j < dims[v]; j++) for (let i = 0; i < dims[u];) {
        const m = mask[n];
        if (!m) { i++; n++; continue; }
        let w = 1;
        while (i + w < dims[u] && mask[n + w] === m) w++;
        let h = 1;
        outer: for (; j + h < dims[v]; h++) for (let k = 0; k < w; k++) if (mask[n + k + h * dims[u]] !== m) break outer;
        x[u] = i; x[v] = j;
        const du = [0, 0, 0], dv = [0, 0, 0];
        du[u] = w; dv[v] = h;
        const b = buf[Math.abs(m) - 1], base = b.pos.length / 3;
        const corners = [[0, 0, 0], du, [du[0] + dv[0], du[1] + dv[1], du[2] + dv[2]], dv];
        for (const cnr of corners) {
          const px = ox + x[0] + cnr[0], py = x[1] + cnr[1] - (water ? .15 : 0), pz = oz + x[2] + cnr[2];  // water sits a little low
          b.pos.push(px, py, pz);
          b.nrm.push(d === 0 ? Math.sign(m) : 0, d === 1 ? Math.sign(m) : 0, d === 2 ? Math.sign(m) : 0);
          // World-space UVs: one texture tile per block, with v running up the sides
          if (d === 0) b.uv.push(pz, py); else if (d === 1) b.uv.push(px, pz); else b.uv.push(px, py);
        }
        if (m > 0) b.idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
        else b.idx.push(base, base + 2, base + 1, base, base + 3, base + 2);
        for (let l = 0; l < h; l++) for (let k = 0; k < w; k++) mask[n + k + l * dims[u]] = 0;
        i += w; n += w;
      }
    }
  }

  // Merge the per-material buffers into one geometry with groups
  const pos = [], nrm = [], uv = [], idx = [], geo = new THREE.BufferGeometry();
  buf.forEach((b, mi) => {
    if (!b.idx.length) return;
    const vOff = pos.length / 3, start = idx.length;
    for (let i = 0; i < b.pos.length; i++) { pos.push(b.pos[i]); nrm.push(b.nrm[i]); }
    for (let i = 0; i < b.uv.length; i++) uv.push(b.uv[i]);
    for (let i = 0; i < b.idx.length; i++) idx.push(b.idx[i] + vOff);
    geo.addGroup(start, b.idx.length, mi);
  });
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  if (!idx.length) return null;
  geo.setIndex(idx);
  geo.computeBoundingSphere();
  const mesh = new THREE.Mesh(geo, materials);
  mesh.matrixAutoUpdate = false;
  return mesh;
}

// Stream chunks around the player: build the nearest missing meshes within a time budget, drop far ones
const VIEW = 6;              // view radius in chunks
let lastCenter = '';
let buildQueue = [];
function streamChunks(px, pz, budgetMs) {
  const pcx = Math.floor(px / CHUNK), pcz = Math.floor(pz / CHUNK), center = pcx + ',' + pcz;
  if (center !== lastCenter) {
    lastCenter = center;
    buildQueue = [];
    for (let dz = -VIEW; dz <= VIEW; dz++) for (let dx = -VIEW; dx <= VIEW; dx++) {
      if (dx * dx + dz * dz > VIEW * VIEW + 1) continue;
      const c = chunks.get(chunkKey(pcx + dx, pcz + dz));
      if (!c || !c.built) buildQueue.push([pcx + dx, pcz + dz, dx * dx + dz * dz]);
    }
    buildQueue.sort((a, b) => b[2] - a[2]);    // nearest last, popped first
    for (const [k, c] of chunks) {
      const ddx = c.cx - pcx, ddz = c.cz - pcz, d2 = ddx * ddx + ddz * ddz;
      if (c.built && d2 > (VIEW + 2) ** 2) {
        for (const m of [c.mesh, c.water]) if (m) { scene.remove(m); m.geometry.dispose(); }
        c.mesh = c.water = null; c.built = false;
      }
      if (d2 > (VIEW + 4) ** 2) chunks.delete(k);
    }
  }
  const t0 = performance.now();
  while (buildQueue.length && performance.now() - t0 < budgetMs) {
    const [cx, cz] = buildQueue.pop();
    const c = chunkAt(cx, cz);
    if (c.built) continue;
    c.mesh = meshChunk(c); c.water = meshChunk(c, true); c.built = true;
    if (c.mesh) scene.add(c.mesh);
    if (c.water) scene.add(c.water);
  }
}

// ---------------------------------------------------------------------------
// ASCII post-process
// ---------------------------------------------------------------------------
// Character sets. FINE uses many glyphs sorted by how much ink they cover, giving
// near-continuous shading; CLASSIC is the short, chunky ramp.
const CANDIDATES = ` .'\`,-_:;~"^!=+<>ir/\\|()?lcvtxzjfsLnuoTJY1I7*e{}[]aZ5S3C2kwyqpdbhXV4EFUPGA9068%OHKRDNQ$#BWM&@`;
const FONT = '"Courier New", Courier, monospace';
const FINE_RAMP = (() => {
  const c = document.createElement('canvas'); c.width = 24; c.height = 40;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.font = `bold 34px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
  const ink = [...new Set(CANDIDATES)].map(ch => {
    g.clearRect(0, 0, 24, 40); g.fillText(ch, 12, 22);
    let sum = 0; const d = g.getImageData(0, 0, 24, 40).data;
    for (let i = 3; i < d.length; i += 4) sum += d[i];
    return [ch, sum];
  }).sort((a, b) => a[1] - b[1]);
  // Keep glyphs whose coverage is noticeably above the previous one so steps are even
  const max = ink[ink.length - 1][1], out = [ink[0]];
  for (const e of ink) if (e[1] - out[out.length - 1][1] > max / 48) out.push(e);
  return out.map(e => e[0]).join('');
})();
const STYLES = {
  fine:    { name: 'FINE',    ramp: FINE_RAMP,      underlay: 0.45, gain: 0.85 },
  classic: { name: 'CLASSIC', ramp: ' .,:-=+*o#%@', underlay: 0.1,  gain: 1.0 },
};
let style = STYLES.fine;

// Glyph atlas drawn at the exact on-screen cell size so small characters stay crisp
function buildGlyphs(cw, ch) {
  const ramp = style.ramp, c = document.createElement('canvas');
  c.width = cw * ramp.length; c.height = ch;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = '#fff'; g.font = `bold ${Math.max(4, Math.round(ch * .9))}px ${FONT}`;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  [...ramp].forEach((chr, i) => g.fillText(chr, i * cw + cw / 2, ch / 2 + ch * .05));
  const t = new THREE.CanvasTexture(c);
  t.generateMipmaps = false;
  t.minFilter = t.magFilter = THREE.NearestFilter;
  return t;
}

const sceneRT = new THREE.WebGLRenderTarget(1, 1, { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
const asciiMat = new THREE.ShaderMaterial({
  uniforms: {
    tScene: { value: sceneRT.texture }, tGlyphs: { value: null },
    resolution: { value: new THREE.Vector2() }, cell: { value: new THREE.Vector2() },
    glyphCount: { value: 1 }, exposure: { value: 2.0 }, underlay: { value: .1 }, gain: { value: 1 },
  },
  vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tScene, tGlyphs;
    uniform vec2 resolution, cell;
    uniform float glyphCount, exposure, underlay, gain;
    varying vec2 vUv;
    void main() {
      vec2 frag = vUv * resolution;
      vec2 ci = floor(frag / cell);
      vec3 c = texture2D(tScene, clamp((ci + 0.5) * cell / resolution, 0.0, 1.0)).rgb;
      c = pow(max(c, 0.0), vec3(1.0 / 2.2)) * exposure;           // linear -> display, brightened
      float l = clamp((dot(c, vec3(0.299, 0.587, 0.114)) - 0.05) / 0.95, 0.0, 1.0);  // black level keeps the sky clean
      float g = min(floor(pow(l, 0.85) * glyphCount), glyphCount - 1.0);
      vec2 local = fract(frag / cell);
      float mask = texture2D(tGlyphs, vec2((g + local.x) / glyphCount, local.y)).r;
      vec3 hue = c / max(max(c.r, max(c.g, c.b)), 0.001);
      vec3 fg = mix(hue * (0.4 + 0.8 * l), c * 1.3, 0.5);
      vec3 col = fg * gain * mask + c * underlay;
      vec2 q = vUv - 0.5;
      col *= 1.0 - dot(q, q) * 0.8;
      gl_FragColor = vec4(col, 1.0);
    }`,
  depthTest: false, depthWrite: false,
});
const postScene = new THREE.Scene();
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), asciiMat));
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const CELLS = [[3, 5], [4, 7], [5, 8], [6, 10], [7, 12], [9, 15], [12, 20]];
let cellIdx = 2, asciiOn = true;

function resize() {

function collides(x, y, z) {

  if (!collides(nx, P.pos.y, nz)) { P.pos.x = nx; P.pos.z = nz; return; }
  if (!P.grounded && !P.inWater) return;                 // swimmers can climb out onto the bank
  for (const up of [.55, 1.05]) {              // auto step onto stairs / crates
    if (!collides(P.pos.x, P.pos.y + up, P.pos.z) && !collides(nx, P.pos.y + up, nz)) {
      P.pos.set(nx, P.pos.y + up, nz); return;
    }
  }
}

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const keys = {};
const touchMove = { x: 0, y: 0 };
let started = false, jumpQueued = false, jumpHeld = false;
const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch) document.body.classList.add('touch');

const startEl = document.getElementById('start');
startEl.addEventListener('click', () => {
  if (!started) P.yaw = 0;
  started = true; startEl.style.display = 'none';
  if (!isTouch) renderer.domElement.requestPointerLock?.();
});
renderer.domElement.addEventListener('click', () => { if (started && !isTouch) renderer.domElement.requestPointerLock?.(); });
document.addEventListener('pointerlockchange', () => {
  if (!document.pointerLockElement && started && !isTouch) {
    document.getElementById('go').textContent = 'paused \u00b7 click to resume';
    startEl.style.display = 'flex'; started = false;
  }
});
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== renderer.domElement) return;
  look(e.movementX * .0022, e.movementY * .0022);
});
function look(dx, dy) {
  P.yaw -= dx;
  P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - dy));
}

function toggleAscii() { asciiOn = !asciiOn; document.getElementById('btnAscii').textContent = `ASCII: ${asciiOn ? 'ON' : 'OFF'}`; }
function cycleCell(d) { cellIdx = (cellIdx + d + CELLS.length) % CELLS.length; resize(); }
function toggleStyle() {
  style = style === STYLES.fine ? STYLES.classic : STYLES.fine;
  document.getElementById('btnStyle').textContent = `STYLE: ${style.name}`;
  resize();
}
document.getElementById('btnAscii').addEventListener('click', e => { e.stopPropagation(); toggleAscii(); });
document.getElementById('btnCell').addEventListener('click', e => { e.stopPropagation(); cycleCell(1); });
document.getElementById('btnStyle').addEventListener('click', e => { e.stopPropagation(); toggleStyle(); });

addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { jumpQueued = true; e.preventDefault(); }  // don't re-press a focused button
  if (e.code === 'KeyT') toggleAscii();
  if (e.code === 'KeyG') toggleStyle();
  if (e.code === 'BracketLeft') cycleCell(-1);
  if (e.code === 'BracketRight') cycleCell(1);
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// Touch: left half is a floating joystick, right half drags to look
const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickId = null, lookId = null, stickOrigin = null, lookLast = null;
const jumpBtn = document.getElementById('jump');
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); jumpQueued = jumpHeld = true; }, { passive: false });
jumpBtn.addEventListener('touchend', () => { jumpHeld = false; });
jumpBtn.addEventListener('touchcancel', () => { jumpHeld = false; });
renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.clientX < innerWidth / 2 && stickId === null) {
      stickId = t.identifier; stickOrigin = { x: t.clientX, y: t.clientY };
      stick.style.left = t.clientX + 'px'; stick.style.top = t.clientY + 'px'; stick.style.display = 'block';
    } else if (lookId === null) {
      lookId = t.identifier; lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });
renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) {
      let dx = t.clientX - stickOrigin.x, dy = t.clientY - stickOrigin.y;
      const len = Math.hypot(dx, dy), max = 50;
      if (len > max) { dx *= max / len; dy *= max / len; }
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      touchMove.x = dx / max; touchMove.y = dy / max;
    } else if (t.identifier === lookId) {
      look((t.clientX - lookLast.x) * .005, (t.clientY - lookLast.y) * .005);
      lookLast = { x: t.clientX, y: t.clientY };
    }
  }
}, { passive: false });
const endTouch = e => {
  for (const t of e.changedTouches) {
    if (t.identifier === stickId) { stickId = null; touchMove.x = touchMove.y = 0; stick.style.display = 'none'; knob.style.transform = ''; }
    if (t.identifier === lookId) lookId = null;
  }
};
renderer.domElement.addEventListener('touchend', endTouch);
renderer.domElement.addEventListener('touchcancel', endTouch);

// ---------------------------------------------------------------------------
// Main loop
// ---------------------------------------------------------------------------
const clock = new THREE.Clock();
const fwd = new THREE.Vector3(), right = new THREE.Vector3();

function update(dt, t) {
  // Movement intent
  let mx = touchMove.x, mz = touchMove.y;
  if (keys.KeyW || keys.ArrowUp) mz -= 1;
  if (keys.KeyS || keys.ArrowDown) mz += 1;
  if (keys.KeyA || keys.ArrowLeft) mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  const len = Math.hypot(mx, mz);
  if (len > 1) { mx /= len; mz /= len; }
  const fx = Math.floor(P.pos.x), fz = Math.floor(P.pos.z);
  P.inWater = get(fx, Math.floor(P.pos.y + .5), fz) === WATER;
  const speed = ((keys.ShiftLeft || keys.ShiftRight) ? 9 : 5) * (P.inWater ? .55 : 1);
  fwd.set(-Math.sin(P.yaw), 0, -Math.cos(P.yaw));
  right.set(Math.cos(P.yaw), 0, -Math.sin(P.yaw));
  const vx = (right.x * mx - fwd.x * mz) * speed * dt;
  const vz = (right.z * mx - fwd.z * mz) * speed * dt;
  const steps = Math.ceil(Math.max(Math.abs(vx), Math.abs(vz)) / .2) || 1;
  for (let i = 0; i < steps; i++) { moveAxis(vx / steps, 0); moveAxis(0, vz / steps); }

  // Gravity, jumping and swimming (hold jump to rise in water)
  if (P.inWater) {
    P.vy = Math.max(-2.5, P.vy - 6 * dt);
    if (keys.Space || jumpHeld) P.vy = Math.min(3.2, P.vy + 20 * dt);
  } else {
    if (jumpQueued && P.grounded) { P.vy = 7.5; P.grounded = false; }
    P.vy -= 22 * dt;
  }
  jumpQueued = false;
  const ny = P.pos.y + P.vy * dt;
  if (P.vy <= 0) {
    if (collides(P.pos.x, ny, P.pos.z)) { P.pos.y = Math.floor(ny) + 1; P.vy = 0; P.grounded = true; }
    else { P.pos.y = ny; P.grounded = false; }
  } else {
    if (collides(P.pos.x, ny, P.pos.z)) P.vy = 0; else P.pos.y = ny;
    P.grounded = false;
  }

  // Camera: smooth step-ups, slight head bob
  const target = P.pos.y + 1.6;
  P.eye = target > P.eye ? P.eye + (target - P.eye) * Math.min(1, dt * 14) : target;
  if (P.grounded && len > .1) P.bob += dt * speed * 1.8;
  camera.position.set(P.pos.x, P.eye + Math.sin(P.bob) * .05, P.pos.z);
  camera.rotation.set(P.pitch, P.yaw, 0);

  // Torch flicker
  for (const tr of torches) {
    const f = .8 + .12 * Math.sin(t * 11 + tr.seed) + .08 * Math.sin(t * 23.7 + tr.seed * 2) + .05 * Math.sin(t * 37 + tr.seed);
    tr.light.intensity = 10 * f;
    tr.flame.scale.set(.9 + .15 * f, 1.4 + .6 * f, .9 + .15 * f);
    tr.flame.rotation.y = t * 3 + tr.seed;
  }

  // Guards ping-pong along their patrol line
  for (const gd of guards) {
    if (!gd.b) { gd.g.rotation.y = 0; continue; }
    gd.t += dt * gd.speed;
    const dist = gd.a.distanceTo(gd.b), phase = (gd.t / dist) % 2;
    const k = phase < 1 ? phase : 2 - phase;
    gd.g.position.lerpVectors(gd.a, gd.b, k);
    const dir = phase < 1 ? gd.b.clone().sub(gd.a) : gd.a.clone().sub(gd.b);
    gd.g.rotation.y = Math.atan2(dir.x, dir.z);
    const swing = Math.sin(gd.t * 5) * .5;
    gd.legs[0].rotation.x = swing; gd.legs[1].rotation.x = -swing;
  }
}

function frame() {
  const dt = Math.min(clock.getDelta(), .05);
  streamChunks(P.pos.x, P.pos.z, 6);
  update(started ? dt : 0, clock.elapsedTime);
  if (!started) { P.yaw = Math.sin(clock.elapsedTime * .15) * .25; camera.rotation.set(P.pitch, P.yaw, 0); }
  sky.position.copy(camera.position);
  // Water: drifting ripples, and murky blue fog with the camera under the surface
  TEX.water.offset.set(clock.elapsedTime * .05, Math.sin(clock.elapsedTime * .4) * .1);
  const under = get(Math.floor(camera.position.x), Math.floor(camera.position.y + .15), Math.floor(camera.position.z)) === WATER;
  scene.fog.color.setHex(under ? 0x0d2e52 : SKY);
  scene.fog.density = under ? .09 : .018;
  scene.background.setHex(under ? 0x0d2e52 : SKY);
  if (asciiOn) {
    renderer.setRenderTarget(sceneRT);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
  } else {
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
}
// Load the area around the start before the first frame so nothing pops in at spawn
P.pos.y = surfaceY(Math.floor(P.pos.x), Math.floor(P.pos.z));
P.eye = P.pos.y + 1.6;
streamChunks(P.pos.x, P.pos.z, Infinity);
camera.position.set(P.pos.x, P.eye, P.pos.z);
window.__fort = { P, camera, scene, chunks, get, surfaceY, SEED, climate, terrainHeight, biomeOf, BIOME_NAMES };
frame();
</script>
